<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" id="icon">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0aa21;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff5e0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring – blockchain / chain motif -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" opacity="0.35" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#shieldGrad)" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.25" />

  <!-- Shield body -->
  <path d="
    M 50 10
    L 84 26
    C 84 26 86 58 72 76
    C 62 88 50 93 50 93
    C 50 93 38 88 28 76
    C 14 58 16 26 16 26
    Z
  " fill="url(#shieldGrad)" opacity="0.9" />

  <!-- Shield inner highlight -->
  <path d="
    M 50 16
    L 78 30
    C 78 30 80 56 68 72
    C 60 82 50 86 50 86
    C 50 86 40 82 32 72
    C 20 56 22 30 22 30
    Z
  " fill="none" stroke="#fff5e0" stroke-width="0.8" opacity="0.4" />

  <!-- Checkmark -->
  <polyline
    points="35,52 46,64 67,38"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Small chain-link dots around the ring -->
  <circle cx="50" cy="4"  r="2" fill="#ef4568" opacity="0.6" />
  <circle cx="80" cy="14" r="1.5" fill="#f0aa21" opacity="0.5" />
  <circle cx="96" cy="50" r="2" fill="#ef4568" opacity="0.6" />
  <circle cx="80" cy="86" r="1.5" fill="#f0aa21" opacity="0.5" />
  <circle cx="50" cy="96" r="2" fill="#ef4568" opacity="0.6" />
  <circle cx="20" cy="86" r="1.5" fill="#f0aa21" opacity="0.5" />
  <circle cx="4"  cy="50" r="2" fill="#ef4568" opacity="0.6" />
  <circle cx="20" cy="14" r="1.5" fill="#f0aa21" opacity="0.5" />
</svg>
